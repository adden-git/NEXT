<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>NEXUS Station v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  </head>
  <body>
    <canvas id="starfield" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;"></canvas>
    <div class="scanlines" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px);"></div>
    <div class="vignette" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,0.8);"></div>
    <div id="root" style="position:relative;z-index:2;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        function init() {
          resize();
          const n = Math.floor((canvas.width * canvas.height) / 2500);
          stars = [];
          for (let i = 0; i < n; i++) {
            stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, z: Math.random() * 2 + 0.5, b: Math.random(), s: Math.random() * 0.02 + 0.005 });
          }
        }
        function draw() {
          ctx.fillStyle = '#040408';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          for (const star of stars) {
            star.b += star.s;
            const a = 0.3 + Math.abs(Math.sin(star.b)) * 0.7;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.z * 0.7, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(200,220,255,${a})`;
            ctx.fill();
          }
          requestAnimationFrame(draw);
        }
        window.addEventListener('resize', () => { resize(); init(); });
        init();
        draw();
      })();
    </script>
  </body>
</html>
