[project]
name = "nexus-code"
version = "1.41.0"
description = "NEXUS Station is a CLI agent that lives in your terminal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["kimi-cli==1.41.0"]

[project.scripts]
nexus-code = "nexus_station.__main__:main"

[build-system]
requires = ["uv_build>=0.8.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nexus_code"]
